services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: home_today
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - home_today_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d home_today']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  home_today_data:
